services:
  mysql-ems:
    image: mysql:8.0
    container_name: ems_mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: ems_database
      MYSQL_USER: ems_user
      MYSQL_PASSWORD: ems_password
    ports:
      - "3306:3306"
    volumes:
      - ems_mysql_data:/var/lib/mysql
      # Mount all SQL files from new-database folder for automatic initialization
      - ./EMS-Database/new-database:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password --sql-mode=""
    networks:
      - ems-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  ems-web:
    build: .
    container_name: ems_web_app
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      mysql-ems:
        condition: service_healthy
    environment:
      - DB_HOST=mysql-ems
      - DB_PORT=3306
      - DB_NAME=ems_database
      - DB_USER=ems_user
      - DB_PASSWORD=ems_password
    networks:
      - ems-network
    volumes:
      - ems_logs:/usr/local/tomcat/logs

networks:
  ems-network:
    driver: bridge

volumes:
  ems_mysql_data:
  ems_logs:
